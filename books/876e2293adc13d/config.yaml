title: "みえないリスクを見える化する - 予防的生徒指導を実現する教育データ革命"
summary: "教育データの利活用とは、単にダッシュボードを作ることではなく、データに基づく意思決定により教育を改善することです。本書では、教育現場に潜む「見えないリスク」の早期発見から、適切な同意取得、データ分類の理解まで、実践的な教育データ活用法を解説します。"
