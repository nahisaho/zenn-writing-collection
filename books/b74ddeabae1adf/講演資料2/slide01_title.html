<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原子力AI技術革命 - タイトルページ</title>
    <style>
        :root {
            --microsoft-blue: #0078D4;
            --microsoft-dark-blue: #005A9E;
            --microsoft-light-blue: #40C0FF;
            --microsoft-gray: #323130;
            --microsoft-light-gray: #F3F2F1;
            --text-primary: #323130;
            --text-secondary: #605E5C;
            --background: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F9FA 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        .slide-container {
            width: 100%;
            max-width: 1600px;
            max-height: 900px;
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 60px;
            position: relative;
            background: radial-gradient(ellipse at center, rgba(0, 120, 212, 0.05) 0%, transparent 70%);
        }

        .title-container {
            text-align: center;
            animation: slideUpFadeIn 1.5s ease-out;
            max-width: 1200px;
        }

        .main-title {
            font-size: 64px;
            font-weight: 700;
            color: var(--microsoft-blue);
            margin-bottom: 40px;
            line-height: 1.1;
            text-shadow: 0 2px 8px rgba(0, 120, 212, 0.2);
        }

        .subtitle {
            font-size: 28px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 60px;
            line-height: 1.3;
        }

        .highlight-box {
            background: rgba(0, 120, 212, 0.08);
            border: 2px solid var(--microsoft-light-blue);
            border-radius: 12px;
            padding: 40px;
            margin: 40px 0;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 120, 212, 0.1);
        }

        .urgent-message {
            font-size: 24px;
            font-weight: 600;
            color: var(--microsoft-dark-blue);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .key-points {
            font-size: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            text-align: left;
            max-width: 800px;
            margin: 0 auto;
        }

        .author-info {
            position: absolute;
            bottom: 40px;
            right: 60px;
            text-align: right;
            color: var(--text-secondary);
            font-size: 18px;
            line-height: 1.4;
        }

        .date {
            font-weight: 600;
            color: var(--microsoft-blue);
        }

        .decorative-element {
            position: absolute;
            top: 40px;
            left: 60px;
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--microsoft-blue), var(--microsoft-light-blue));
            border-radius: 2px;
        }

        @keyframes slideUpFadeIn {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 32px;
            height: 32px;
            display: inline-block;
        }

        @media (max-width: 1400px) {
            .main-title { font-size: 56px; }
            .subtitle { font-size: 24px; }
            .urgent-message { font-size: 22px; }
            .key-points { font-size: 18px; }
        }

        @media (max-width: 1024px) {
            .slide-container { padding: 60px 40px; }
            .main-title { font-size: 48px; }
            .subtitle { font-size: 20px; }
            .highlight-box { padding: 30px; }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="decorative-element"></div>
        
        <div class="title-container">
            <h1 class="main-title">原子力AI技術革命</h1>
            <p class="subtitle">日本のエネルギー安全保障と気候変動対策の切り札</p>
            
            <div class="highlight-box">
                <div class="urgent-message">
                    <span class="icon">⚡</span>
                    原子力×AI融合は、もはや選択ではなく必然である
                </div>
                <div class="key-points">
                    日本の残された時間：<strong>2025-2027年が勝負の3年間</strong><br>
                    福島の経験を世界標準の競争力へ転換する最後の機会
                </div>
            </div>
        </div>

        <div class="author-info">
            <div class="date">2025年9月</div>
            <div>日本原子力学会 2025年秋の大会</div>
            <div>講演補足資料</div>
            <div style="margin-top: 12px; font-weight: 500;">中田 寿穂</div>
        </div>
    </div>
</body>
</html>
