# Proposal Templates Catalog
# v2.0.0 - REQ-TMPL-001-01
#
# 業界別提案書テンプレート定義

schema_version: "2.0"
name: proposal-templates
description: |
  業界別・ペルソナ別の提案書テンプレート。
  各テンプレートは必須/任意のプレースホルダーを含み、
  リサーチ結果からの自動補完に対応。

# 共通セクション定義
common_sections:
  executive_summary:
    name: "エグゼクティブサマリー"
    description: "提案の要約（経営層向け1ページ）"
    required: true
    structure:
      - title: "提案概要"
        content_type: "summary"
      - title: "期待効果"
        content_type: "bullet_points"
      - title: "投資概要"
        content_type: "table"
    max_length: 500
    
  current_challenges:
    name: "現状課題"
    description: "顧客が直面している課題の整理"
    required: true
    structure:
      - title: "業界トレンド"
        content_type: "narrative"
      - title: "顧客固有の課題"
        content_type: "bullet_points"
      - title: "課題の定量化"
        content_type: "metrics"
    
  proposed_solution:
    name: "提案ソリューション"
    description: "課題を解決する製品・サービスの説明"
    required: true
    structure:
      - title: "ソリューション概要"
        content_type: "narrative"
      - title: "主要機能"
        content_type: "feature_table"
      - title: "差別化ポイント"
        content_type: "bullet_points"
    
  expected_benefits:
    name: "導入効果"
    description: "導入による期待効果（定量・定性）"
    required: true
    structure:
      - title: "定量効果"
        content_type: "metrics"
      - title: "定性効果"
        content_type: "bullet_points"
      - title: "類似事例"
        content_type: "case_study"
    
  roi_analysis:
    name: "投資対効果"
    description: "ROI分析、コスト比較"
    required: true
    structure:
      - title: "初期投資"
        content_type: "cost_table"
      - title: "ランニングコスト"
        content_type: "cost_table"
      - title: "ROI計算"
        content_type: "calculation"
      - title: "TCO比較"
        content_type: "comparison_table"
    
  implementation_plan:
    name: "導入ステップ"
    description: "導入スケジュールとマイルストーン"
    required: true
    structure:
      - title: "フェーズ概要"
        content_type: "phase_table"
      - title: "詳細スケジュール"
        content_type: "gantt"
      - title: "役割分担"
        content_type: "responsibility_matrix"
    
  appendix:
    name: "付録"
    description: "詳細仕様、参考資料"
    required: false
    structure:
      - title: "技術仕様"
        content_type: "spec_table"
      - title: "参考文献"
        content_type: "references"

# 業界別テンプレート定義
templates:
  # ============================================
  # 教育機関向けテンプレート
  # ============================================
  education_executive:
    id: "education-executive"
    name: "教育機関向け（経営層）"
    description: "大学・教育機関の経営層向け提案書"
    industry: "education"
    persona: "executive"
    
    sections:
      - section_ref: executive_summary
        customization:
          emphasis: ["教育DX", "競争力強化", "学生満足度"]
          metrics: ["入学者数", "卒業率", "就職率"]
      
      - section_ref: current_challenges
        customization:
          focus_areas:
            - "少子化による入学者減"
            - "教育のデジタル化対応"
            - "学生サービスの高度化"
            - "教職員の業務効率化"
          data_sources:
            - "文部科学省統計"
            - "大学ランキング"
            - "学生満足度調査"
      
      - section_ref: proposed_solution
        customization:
          value_proposition: "教育の質向上と運営効率化の両立"
      
      - section_ref: expected_benefits
        customization:
          kpis:
            - name: "学生満足度"
              target: "10%向上"
            - name: "教職員業務時間"
              target: "20%削減"
            - name: "IT運用コスト"
              target: "15%削減"
      
      - section_ref: roi_analysis
        customization:
          comparison_targets:
            - "現状維持"
            - "競合A"
            - "競合B"
      
      - section_ref: implementation_plan
        customization:
          considerations:
            - "学期スケジュール"
            - "入試時期の回避"
            - "教授会承認プロセス"
    
    placeholders:
      required:
        - name: "{{製品名}}"
          description: "提案する製品・サービス名"
          extraction_path: "manifest.product.name"
        - name: "{{顧客名}}"
          description: "提案先大学・教育機関名"
          extraction_path: "manifest.client.name"
        - name: "{{提案日}}"
          description: "提案書作成日"
          default: "{{TODAY}}"
        - name: "{{ライセンス数}}"
          description: "想定ライセンス数"
          extraction_path: "manifest.scope.licenses"
      optional:
        - name: "{{学生数}}"
          description: "対象学生数"
          extraction_path: "research.client_profile.student_count"
        - name: "{{教職員数}}"
          description: "対象教職員数"
          extraction_path: "research.client_profile.staff_count"
        - name: "{{現行システム}}"
          description: "現在使用中のシステム"
          extraction_path: "research.current_systems"
    
    tone:
      formality: "high"
      emphasis: ["実績", "信頼性", "長期パートナーシップ"]
      avoid: ["技術的詳細", "専門用語多用"]

  education_it:
    id: "education-it"
    name: "教育機関向け（IT部門）"
    description: "大学・教育機関のIT部門向け提案書"
    industry: "education"
    persona: "it_department"
    
    sections:
      - section_ref: executive_summary
        customization:
          emphasis: ["技術的優位性", "統合性", "セキュリティ"]
      
      - section_ref: current_challenges
        customization:
          focus_areas:
            - "レガシーシステムの保守負担"
            - "システム間連携の複雑さ"
            - "セキュリティ対策の高度化"
            - "クラウド移行の検討"
          data_sources:
            - "システム構成図"
            - "運用コスト内訳"
            - "インシデント履歴"
      
      - section_ref: proposed_solution
        customization:
          value_proposition: "既存システムとの円滑な統合と運用負荷軽減"
          technical_details: true
      
      - section_ref: expected_benefits
        customization:
          kpis:
            - name: "システム稼働率"
              target: "99.9%以上"
            - name: "インシデント対応時間"
              target: "50%短縮"
            - name: "運用工数"
              target: "30%削減"
      
      - section_ref: roi_analysis
        customization:
          include_tco: true
          comparison_period: "5年"
      
      - section_ref: implementation_plan
        customization:
          considerations:
            - "既存システム移行計画"
            - "データ移行手順"
            - "テスト環境構築"
            - "ロールバック計画"
      
      - section_ref: appendix
        customization:
          include:
            - "技術仕様書"
            - "API連携仕様"
            - "セキュリティホワイトペーパー"
    
    placeholders:
      required:
        - name: "{{製品名}}"
          description: "提案する製品・サービス名"
          extraction_path: "manifest.product.name"
        - name: "{{顧客名}}"
          description: "提案先機関名"
          extraction_path: "manifest.client.name"
        - name: "{{提案日}}"
          description: "提案書作成日"
          default: "{{TODAY}}"
      optional:
        - name: "{{LMS名}}"
          description: "現行LMS名（Moodle, Canvas等）"
          extraction_path: "research.current_systems.lms"
        - name: "{{IdP}}"
          description: "認証基盤（Azure AD, Shibboleth等）"
          extraction_path: "research.current_systems.idp"
        - name: "{{データセンター}}"
          description: "現行データセンター情報"
          extraction_path: "research.infrastructure.datacenter"
    
    tone:
      formality: "medium"
      emphasis: ["技術仕様", "セキュリティ", "運用効率"]
      include: ["技術的詳細", "連携方法", "移行手順"]

