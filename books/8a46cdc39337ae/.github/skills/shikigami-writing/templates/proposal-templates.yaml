      emphasis: ["FISC準拠", "監査対応", "高可用性"]
      include: ["技術仕様", "セキュリティ詳細", "SLA"]

# 出力フォーマット設定
output_format:
  file_extension: ".md"
  naming_pattern: "{{client_name}}-proposal-{{template_id}}-{{version}}.md"
  
  header_template: |
    # {{製品名}} 導入提案書
    
    **提案先**: {{顧客名}} 様  
    **提案日**: {{提案日}}  
    **作成者**: {{作成者}}  
    **バージョン**: {{version}}
    
    ---
    
    ## 変更履歴
    
    | バージョン | 日付 | 変更内容 |
    |-----------|------|----------|
    | v1.0 | {{提案日}} | 初版作成 |
    
    ---
  
  toc_template: |
    ## 目次
    
    {{#each sections}}
    {{index}}. [{{name}}](#{{anchor}})
    {{/each}}
    
    ---

# バリデーションルール
validation:
  required_placeholders:
    error_on_missing: true
    warning_message: "必須プレースホルダー '{{name}}' が未設定です"
  
  optional_placeholders:
    error_on_missing: false
    warning_message: "任意プレースホルダー '{{name}}' が未設定です（スキップ可）"
  
  max_unresolved: 0
  
  placeholder_pattern: "\\{\\{[^}]+\\}\\}"
