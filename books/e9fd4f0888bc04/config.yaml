title: "生成AI依存で『考えない子ども』が急増中 - 世界の研究データが示す教育現場の危険信号"
summary: "単なる警鐘本ではありません。生成AI時代の教育現場で急増する「考えない子ども」問題の科学的分析から、実践的解決策まで完全網羅。MIT・スタンフォード大学等の研究エビデンスを基に、CPPD（認知保護型プロンプト設計法）による具体的指導法・評価手法・学校導入プログラムを詳説します。"
